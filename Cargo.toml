[package]
name = "inprsn-rs"
version = "0.1.0"
authors = ["Inparsian <im@inpr.sn>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-channel = "2.5.0"
chrono = "0.4.44"
dioxus = { version = "0.7.9", features = ["fullstack", "router"] }
dioxus-cookie = "0.2.0"
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
getrandom = { version = "0.4.2", features = ["wasm_js"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
lru = "0.16.4"
rand = { version = "0.10.1", features = ["thread_rng"] }
shlex = "1.3.0"
uuid = { version = "1.23.1", features = ["v4", "js"] }
wasm-bindgen = "0.2.121"
web-sys = { version = "0.3.98", features = ["HtmlAudioElement", "KeyboardEvent", "FocusEvent", "MouseEvent", "Performance"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
